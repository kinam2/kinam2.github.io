<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}
    <main class="page-content" aria-label="자료실">
      <div class="wrapper">
        {% include theme-mode.html %}
        <article class="post">
          <header class="post-header">
            <h1 class="post-title">{{ page.title | escape }}</h1>
          </header>
          <div class="post-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
