<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
  {%- include head.html -%}
  <style>
    .library-header .wrapper { display: flex; align-items: center; justify-content: space-between; }
    .library-header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 3.4; }
    .library-header a { color: inherit; }
  </style>
  <body>
    <header class="site-header library-header">
      <div class="wrapper">
        <h1 id="library-title">{{ page.section_title | default: page.title | escape }}</h1>
        <a href="{{ '/' | relative_url }}" aria-label="bahula 대문">bahula</a>
      </div>
    </header>
    <main class="page-content" aria-labelledby="library-title">
      <div class="wrapper">
        {% include theme-mode.html %}
        <article class="post">
          <div class="post-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
