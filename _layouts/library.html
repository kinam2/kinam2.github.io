<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
  {%- include head.html -%}
  <style>
    .library-header .wrapper { display: flex; align-items: center; justify-content: space-between; }
    .library-header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 3.4; }
    .library-header a { color: inherit; }
    .library-header .library-heading-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .library-header .library-home-icon { margin-left: auto; }
    .library-home-icon { display: grid; place-items: center; min-width: 44px; min-height: 44px; margin-right: -8px; }
    .library-home-icon img { display: block; width: 28px; height: 28px; object-fit: contain; }
  </style>
  <body>
    <header class="site-header library-header">
      <div class="wrapper">
        <h1 id="library-title"{% if page.url == '/library/' %} class="library-heading-visually-hidden"{% endif %}>{{ page.section_title | default: page.title | escape }}</h1>
        {%- if page.url == '/library/' or page.url == '/reflections/' or page.collection == 'reflections' %}
        <a class="library-home-icon" href="{{ '/' | relative_url }}" aria-label="성자의 옛길 대문" title="대문으로"><img src="{{ '/assets/bahula-leaf.png' | relative_url }}" width="28" height="28" alt=""></a>
        {%- else %}
        <a href="{{ '/' | relative_url }}" aria-label="성자의 옛길 대문">{{ site.title | escape }}</a>
        {%- endif %}
      </div>
    </header>
    <main class="page-content" aria-labelledby="library-title">
      <div class="wrapper">
        {% include theme-mode.html %}
        <article class="post">
          <div class="post-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
