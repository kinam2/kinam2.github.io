---
layout: library
title: 자료실
permalink: /library/
---
<style>
  .library-search-bar { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; width: min(100%, 15rem); margin-left: auto; }
  .library-search-toggle:not([hidden]) { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 5px; color: inherit; background: transparent; cursor: pointer; }
  .library-search-toggle:hover { background: rgba(128, 128, 128, .15); }
  .library-search-toggle:focus-visible { outline: 2px solid currentColor; }
  .library-search { min-width: 0; }
  .library-search input { display: block; box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 .25rem; border: 0; outline: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; }
  .library-search-status { margin: 0; text-align: right; }
  .library-search-status:empty { display: none; }
</style>
<div class="library-search-bar">
  <button class="library-search-toggle" type="button" hidden aria-controls="library-search" aria-expanded="false" aria-label="자료 검색 열기" title="자료 검색 열기">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
  </button>
  <div class="library-search" id="library-search" role="search" hidden>
    <input type="search" aria-label="제목·주제·태그 검색" autocomplete="off">
  </div>
</div>
<p class="library-search-status" role="status"></p>
{% include library-catalog.html %}

<p><a href="{{ '/' | relative_url }}">대문으로</a></p>

<script>
(() => {
  const search = document.querySelector('.library-search');
  const input = search.querySelector('input');
  const toggle = document.querySelector('.library-search-toggle');
  const status = document.querySelector('.library-search-status');
  const normalize = value => value.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const groups = Array.from(document.querySelectorAll('[data-library-topic]'), group => ({group, entries: Array.from(group.querySelectorAll('[data-library-entry]'), row => ({row, key: normalize(row.dataset.libraryEntry)}))}));
  function update() {
    const terms = normalize(input.value).split(' ').filter(Boolean);
    let count = 0;
    for (const {group, entries} of groups) {
      let matches = 0;
      for (const {row, key} of entries) {
        row.hidden = !terms.every(term => key.includes(term));
        if (!row.hidden) matches++;
      }
      group.hidden = matches === 0;
      count += matches;
    }
    status.textContent = terms.length ? (count ? `검색 결과 ${count}개` : '일치하는 자료가 없습니다.') : '';
  }
  input.addEventListener('input', update);
  function setOpen(open) {
    search.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    const label = open ? '자료 검색 닫기' : '자료 검색 열기';
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
    if (open) input.focus();
    else {
      input.value = '';
      update();
      toggle.focus();
    }
  }
  toggle.addEventListener('click', () => setOpen(search.hidden));
  search.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      setOpen(false);
    }
  });
  toggle.hidden = false;
  update();
})();
</script>
