<style>
  .theme-mode { margin-left: auto; }
  .theme-mode button:not([hidden]) { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 5px; color: inherit; background: transparent; cursor: pointer; }
  .theme-mode svg[data-sun], html[data-bahula-theme="dark"] .theme-mode svg[data-moon] { display: none; }
  html[data-bahula-theme="dark"] .theme-mode svg[data-sun] { display: block; }
  .theme-mode button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  html[data-bahula-theme="dark"] { color-scheme: dark; }
  html[data-bahula-theme="dark"] body { background: #15191e; color: #e4e8ee; }
  html[data-bahula-theme="dark"] a { color: #9ec7ff; }
  html[data-bahula-theme="dark"] a:visited { color: #c6b8fa; }
  html[data-bahula-theme="dark"] a:hover { color: #e4e8ee; }
  html[data-bahula-theme="dark"] .site-header { border-color: #474f59; }
  html[data-bahula-theme="dark"] .site-title,
  html[data-bahula-theme="dark"] .site-nav .page-link { color: #e4e8ee; }
  @media screen and (max-width: 600px) {
    html[data-bahula-theme="dark"] .site-nav { background: #15191e; border-color: #626d78; }
    html[data-bahula-theme="dark"] .site-nav .menu-icon > svg path { fill: #e4e8ee; }
  }
  html[data-bahula-theme="dark"] footer a[href$="/feed.xml"] svg { color: #ffb56b !important; }
  html[data-bahula-theme="dark"] footer a[href*="app.netlify.com"] { color: #61e6de !important; }
</style>
{% if include.show_toggle %}
<div class="theme-mode">
  <button type="button" hidden data-theme-toggle aria-label="밤 모드로 전환">
    <svg data-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 13.1A9 9 0 1 1 10.9 3 7 7 0 0 0 21 13.1Z"/></svg>
    <svg data-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></svg>
  </button>
</div>
{% endif %}
<script>
(function () {
  const root = document.documentElement;
  const button = document.querySelector('[data-theme-toggle]');
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const key = 'bahula-color-theme';
  let saved;
  try { saved = localStorage.getItem(key); } catch (_) {}
  function apply() {
    const mode = (saved === 'dark' || saved === 'light') ? saved : (system.matches ? 'dark' : 'light');
    root.dataset.bahulaTheme = mode;
    if (button) {
      const label = mode === 'dark' ? '낮 모드로 전환' : '밤 모드로 전환';
      button.setAttribute('aria-label', label);
      button.title = label;
    }
  }
  apply();
  if (button) {
    button.hidden = false;
    button.addEventListener('click', function () {
      saved = root.dataset.bahulaTheme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(key, saved); } catch (_) {}
      apply();
    });
  }
  system.addEventListener('change', apply);
  window.addEventListener('storage', function (event) {
    if (event.key === key || event.key === null) {
      saved = event.newValue;
      apply();
    }
  });
  window.addEventListener('pageshow', function () {
    try { saved = localStorage.getItem(key); } catch (_) {}
    apply();
  });
}());
</script>
