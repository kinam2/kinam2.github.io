content:
  - name: library
    label: HTML 자료실 목록
    type: file
    path: _data/library.yml
    format: yaml
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: topic
        label: 주제
        type: string
        required: true
      - name: tags
        label: 검색 태그
        type: string
        list: true
      - name: url
        label: HTML 주소
        type: string
        required: true
      - name: type
        label: 자료 유형
        type: string
      - name: library_order
        label: 표시 순서
        type: number
      - name: pdf
        label: PDF 주소 [선택]
        type: string
  - name: reflections
    label: 단상 글
    type: collection
    path: _reflections
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    exclude: [".gitkeep"]
    subfolders: false
    operations:
      rename: false
    view:
      fields: [title, date]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: 본문
        type: rich-text
        required: true
        description: 저장하면 공개 저장소에 올라갑니다. 공개할 글만 입력하세요.
